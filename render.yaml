services:
  - type: web
    name: nexus-server
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start --workspace=@nexus/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

databases:
  - name: nexus-db
    plan: free
    region: frankfurt
    databaseName: nexus
    user: nexus
