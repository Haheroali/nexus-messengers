services:
  - type: web
    name: nexus-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm install --include=dev && npm run db:generate && npm run build --workspace=@nexus/server
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start --workspace=@nexus/server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://nexus-api.onrender.com,capacitor://localhost,https://localhost,http://localhost:3000
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: nexus-media
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

  - type: keyvalue
    name: nexus-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList:
      - source: 0.0.0.0/32
        description: External access disabled; use the internal connection URL

databases:
  - name: nexus-db
    plan: free
    region: frankfurt
    databaseName: nexus
    user: nexus
    ipAllowList: []
